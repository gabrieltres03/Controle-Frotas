<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c70bc" />
  <title>Mapa de pneus | Controle de Frota</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/estilos.css" />
  <link rel="stylesheet" href="css/admin-comum.css" />
  <link rel="stylesheet" href="css/mapa-pneus.css" />
</head>
<body>

  <header class="topo-admin">
    <a class="botao-voltar" href="admin.html">‹</a>
    <span class="topo-titulo">Mapa de pneus</span>
  </header>

  <main class="conteudo-admin">
    <div class="campo" style="margin-bottom:16px">
      <label for="selectCaminhao">Caminhão</label>
      <select id="selectCaminhao" onchange="trocarCaminhao(this.value)">
        <option value="">Selecione um caminhão</option>
      </select>
    </div>

    <div id="mapaEixos"></div>
  </main>

  <div class="folha" id="folhaSlot">
    <div class="folha-conteudo">
      <div class="folha-cabecalho">
        <h2 id="tituloSlot">Posição</h2>
        <button class="folha-fechar" onclick="fecharSlot()">&times;</button>
      </div>
      <div class="folha-corpo" id="corpoSlot"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utilitarios.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-pneus.js"></script>
</body>
</html>
