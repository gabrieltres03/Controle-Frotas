<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c70bc" />
  <title>Relatórios | Controle de Frota</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/estilos.css" />
  <link rel="stylesheet" href="css/admin-comum.css" />
</head>
<body>

  <header class="topo-admin">
    <a class="botao-voltar" href="admin.html">‹</a>
    <span class="topo-titulo">Relatórios</span>
  </header>

  <main class="conteudo-admin">
    <div class="campo">
      <label for="dataInicio">De</label>
      <input type="date" id="dataInicio" />
    </div>
    <div class="campo">
      <label for="dataFim">Até</label>
      <input type="date" id="dataFim" />
    </div>
    <div class="campo">
      <label for="filtroCaminhao">Caminhão (opcional)</label>
      <select id="filtroCaminhao"><option value="">Todos</option></select>
    </div>
    <div class="campo">
      <label for="filtroMotorista">Motorista (opcional)</label>
      <select id="filtroMotorista"><option value="">Todos</option></select>
    </div>

    <button class="botao-primario" style="margin-bottom:20px" onclick="gerarRelatorio()">Gerar relatório</button>

    <div id="resumoRelatorio"></div>

    <div id="acoesExportar" style="display:none; gap:10px; margin-top:16px">
      <button class="botao-linha" style="flex:1" onclick="exportarExcel()">Exportar Excel</button>
      <button class="botao-linha" style="flex:1" onclick="exportarPdf()">Exportar PDF</button>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utilitarios.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-relatorios.js"></script>
</body>
</html>
