<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c70bc" />
  <title>Tipos de despesa | Controle de Frota</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/estilos.css" />
  <link rel="stylesheet" href="css/admin-comum.css" />
</head>
<body>

  <header class="topo-admin">
    <a class="botao-voltar" href="admin.html">‹</a>
    <span class="topo-titulo">Tipos de despesa</span>
  </header>

  <main class="conteudo-admin">
    <p style="font-size:13px; color:var(--texto-secundario); margin-bottom:14px">
      Esses são os tipos extras que o motorista pode escolher na aba Despesas, além de Alimentação — ex: Arla 32, Cheirinho, Lixeiro.
    </p>
    <div class="lista-itens" id="listaTipos">
      <p class="carregando">Carregando...</p>
    </div>
  </main>

  <button class="botao-fab" onclick="abrirFormulario()">+</button>

  <div class="folha" id="folhaTipo">
    <div class="folha-conteudo">
      <div class="folha-cabecalho">
        <h2>Novo tipo de despesa</h2>
        <button class="folha-fechar" onclick="fecharFormulario()">&times;</button>
      </div>
      <div class="folha-corpo">
        <div class="campo">
          <label for="campoNomeTipo">Nome</label>
          <input id="campoNomeTipo" placeholder="Ex: Arla 32" />
        </div>
      </div>
      <div class="folha-rodape">
        <button class="botao-primario" onclick="salvarTipo()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utilitarios.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-tipos-lancamento.js"></script>
  <script src="js/registrar-sw.js"></script>
</body>
</html>
